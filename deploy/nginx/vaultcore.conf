# Host nginx for VaultCore Financial on Oracle Cloud.
# Terminates TLS (Let's Encrypt) and reverse-proxies to the internal compose gateway on
# 127.0.0.1:8082, which does the app-level routing (/, /api, /auth, /realms, ...).
#
# Install:  sudo cp deploy/nginx/vaultcore.conf /etc/nginx/sites-available/vaultcore.conf
#           sudo ln -sf /etc/nginx/sites-available/vaultcore.conf /etc/nginx/sites-enabled/
#           sudo sed -i 's/vaultcore.example.com/YOUR_DOMAIN/g' /etc/nginx/sites-available/vaultcore.conf
# Then obtain certs (see docs/deployment/oracle-cloud.md), and: sudo nginx -t && sudo systemctl reload nginx

# ---- HTTP: ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name vaultcore.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: reverse proxy to the internal gateway ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vaultcore.example.com;

    ssl_certificate     /etc/letsencrypt/live/vaultcore.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vaultcore.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Keycloak sends large auth cookies/headers.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    client_max_body_size 20m;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # HSTS (only after HTTPS is confirmed working)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # critical: Keycloak sees requests as HTTPS
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 120s;
    }
}
