services:
  db:
    image: postgres:15
    container_name: vaultcore-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vaultcore_pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: vaultcore-keycloak
    command: ["start", "--import-realm"]
    volumes:
      - ./docker/keycloak/realm-import:/opt/keycloak/data/import:ro
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_URL: "http://vaultcore-keycloak:8080"
      KC_HOSTNAME_ADMIN_URL: "http://vaultcore-keycloak:8080"
      KC_PROXY_HEADERS: "xforwarded"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vaultcore-redis
    # Host port 6380 (container still 6379) so a local Redis / another project on 6379 does not
    # clash; the app connects internally via the compose network (vaultcore-redis:6379).
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  stock-mock-api:
    container_name: vaultcore-stock-mock
    build: ./docker/mock-stock-api
    ports:
      - "8081:8080"
    restart: unless-stopped

  backend:
    build: .
    container_name: vaultcore-app
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI}
      OAUTH2_JWK_SET_URI: ${OAUTH2_JWK_SET_URI}
      SPRING_REDIS_HOST: vaultcore-redis
      SPRING_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
      STOCK_API_BASE_URL: http://vaultcore-stock-mock:8080/api
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      stock-mock-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vaultcore-frontend
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: vaultcore-gateway
    ports:
      - "8082:80"
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health.json | grep -q 'UP'"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  vaultcore_pgdata: