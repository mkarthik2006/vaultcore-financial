services:
  db:
    image: postgres:15
    container_name: vaultcore-db
    environment:
      POSTGRES_DB: vaultcore
      POSTGRES_USER: vaultuser
      POSTGRES_PASSWORD: vaultpass
    volumes:
      - vaultcore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultuser -d vaultcore"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    container_name: vaultcore-app
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vaultcore
      SPRING_DATASOURCE_USERNAME: vaultuser
      SPRING_DATASOURCE_PASSWORD: vaultpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vaultcore-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://vaultcore-app:8080

volumes:
  vaultcore_pgdata: