services:
  db:
    image: postgres:15
    container_name: vaultcore-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vaultcore_pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: vaultcore-keycloak
    command: ["start", "--import-realm"]
    volumes:
      - ./docker/keycloak/realm-import:/opt/keycloak/data/import:ro
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB}
      KC_DB_SCHEMA: ${KEYCLOAK_DB_SCHEMA}

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_URL: "http://localhost:8082"
      KC_HOSTNAME_ADMIN_URL: "http://localhost:8082"
      KC_PROXY_HEADERS: "xforwarded"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vaultcore-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  stock-mock-api:
    container_name: vaultcore-stock-mock
    build: ./docker/mock-stock-api
    ports:
      - "8081:8080"
    restart: unless-stopped

  backend:
    build: .
    container_name: vaultcore-app
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      OAUTH2_ISSUER_URI: http://localhost:8082/realms/vaultcore
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/vaultcore/protocol/openid-connect/certs
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT}
      SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_started
      stock-mock-api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vaultcore-frontend
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: vaultcore-gateway
    ports:
      - "8082:80"
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
      - keycloak
    restart: unless-stopped

volumes:
  vaultcore_pgdata: