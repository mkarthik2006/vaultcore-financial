spring:
  application:
    name: vaultcore-financial

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.redisson.hibernate.RedissonRegionFactory
          redisson:
            config: classpath:redisson.yaml   # ✅ fixed indentation
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: redis

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8081/realms/vaultcore}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://keycloak:8080/realms/vaultcore/protocol/openid-connect/certs}
  threads:
    virtual:
      enabled: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO

app:
  fraud:
    threshold: 10000
    challenge-enabled: true
    challenge-channel: "mock-sms"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always