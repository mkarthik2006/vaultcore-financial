spring:
  application:
    name: vaultcore-financial

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.redisson.hibernate.RedissonRegionFactory
          redisson:
            config: classpath:redisson.yaml
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: redis

  data:
    redis:
      host: ${SPRING_REDIS_HOST:vaultcore-redis}
      port: ${SPRING_REDIS_PORT:6379}
      repositories:
        enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://vaultcore-keycloak:8080/realms/vaultcore}

  threads:
    virtual:
      enabled: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8082}

  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${APP_RATE_LIMIT_RPM:300}

  fraud:
    threshold: 10000
    challenge-enabled: true
    challenge-channel: "mock-sms"
    challenge-ttl-seconds: ${FRAUD_CHALLENGE_TTL_SECONDS:300}

  stock:
    api:
      base-url: ${STOCK_API_BASE_URL:http://vaultcore-stock-mock:8080/api}
      cache-ttl-ms: ${STOCK_API_CACHE_TTL_MS:2000}
      timeout-ms: ${STOCK_API_TIMEOUT_MS:250}

  security:
    jwt:
      audience: ${OAUTH2_AUDIENCE:}
      allowed-clock-skew-seconds: ${OAUTH2_ALLOWED_CLOCK_SKEW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always