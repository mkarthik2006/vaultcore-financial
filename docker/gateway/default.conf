server {
    listen 80;
    server_name _;

    # Do not leak the nginx version in the Server header.
    server_tokens off;

    client_header_buffer_size 64k;
    large_client_header_buffers 8 64k;

    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;

    # --- Keycloak (preferred gateway path) ---
    location /auth/ {
        proxy_pass http://vaultcore-keycloak:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --- Keycloak compatibility routes ---
    location /realms/ {
        proxy_pass http://vaultcore-keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # A bare "/admin/" compat route to Keycloak's console used to live here, but it shadowed the
    # SPA's own /admin route (Admin Provisioning) on hard navigation/refresh, making that page
    # unreachable by direct URL. Keycloak's admin console is still reachable via /auth/admin/... —
    # nothing depended on the bare path (checked docs/README/deploy scripts).

    location /resources/ {
        proxy_pass http://vaultcore-keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --- Backend API ---
    location /api/ {
        proxy_pass http://vaultcore-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --- Backend health/info (Spring Actuator; SecurityConfig permits these two unauthenticated) ---
    location /actuator/ {
        proxy_pass http://vaultcore-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --- Frontend (SPA) ---
    location / {
        proxy_pass http://vaultcore-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Security headers for the SPA and its static assets (the backend /api and Keycloak set
        # their own; these are scoped to the frontend to avoid duplicating/overriding those).
        # SAMEORIGIN (not DENY) preserves Keycloak's same-origin silent-check-sso iframe.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # 'sha256-...' allowlists the static inline script in silent-check-sso.html (keycloak-js's
        # postMessage boilerplate for its silent SSO re-check iframe, used on every page load) —
        # without it, script-src 'self' blocks that script and the SPA hangs on "Loading..." after
        # any hard refresh, since keycloak.init()'s promise never resolves.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0zZPgsifJ8h8aM+gmSxkrfNtAGUZb7ItVug6/j1UR5g='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location /health.json {
        return 200 '{"status":"UP"}';
        add_header Content-Type application/json;
    }
}